const KONFIG = {
  // Standort für Wetter und Warnungen (Braunschweig)
  breite: 52.2689,
  laenge: 10.5268,
  zeitzone: "Europe/Berlin",

  // Kacheln ein- oder ausschalten und Anzahl der Einträge

  muellArten: {

};

  .nacht .eintrag .tonne { color: var(--leise); color: color-mix(in srgb, var(--tonne) 45%, #000); }
  .nacht .faellig { background: var(--linie); background: color-mix(in srgb, var(--tonne) 30%, #000); color: var(--uhr); }

  #warnung {

<script>
const $ = id => document.getElementById(id);
const K = KONFIG;
const tz = K.zeitzone;
const isoFormat = new Intl.DateTimeFormat("sv-SE", { timeZone: tz, dateStyle: "short", timeStyle: "short" });
const tagKurz = new Intl.DateTimeFormat("de-DE", { timeZone: tz, weekday: "short" });
const tagLang = new Intl.DateTimeFormat("de-DE", { timeZone: tz, weekday: "long" });
const monatKurz = new Intl.DateTimeFormat("de-DE", { timeZone: tz, month: "short" });

// Zeit in Berlin als "JJJJ-MM-TTTHH:MM", im selben Format wie Open-Meteo
const iso = d => isoFormat.format(d).replace(" ", "T");
const jetzt = () => iso(new Date());
const alsDatum = tag => new Date(tag + "T12:00:00Z");

// WMO-Wettercodes: [bis Code, Text, Symbol]
const WMO = [
  [0, "Klar", "sonne-i"], [1, "Heiter", "sonne-i"], [2, "Wolkig", "teils"], [3, "Bedeckt", "wolke"],
  [48, "Nebel", "nebel"], [55, "Niesel", "regen"], [57, "Eisregen", "regen"], [65, "Regen", "regen"],
  [67, "Eisregen", "regen"], [77, "Schnee", "schnee"], [82, "Schauer", "regen"], [86, "Schnee", "schnee"],
  [99, "Gewitter", "gewitter"],
];
const wmo = code => WMO.find(w => code <= w[0]) || WMO[3];
const grad = t => String(Math.round(t)).replace("-", "−") + "°";
const symbol = name => `<svg><use href="#${name}"/></svg>`;
const wetterSymbol = (code, tag = 1) => symbol(wmo(code)[2] === "sonne-i" && !tag ? "mond" : wmo(code)[2]);
const abstand = (tag, heute) => Math.round((alsDatum(tag) - alsDatum(heute)) / 864e5);
const kurzesDatum = tag => `${tagKurz.format(alsDatum(tag))}, ${tag.slice(8)}.${tag.slice(5, 7)}.`;

// Tage bis zum Sonntag dieser Woche
const resteWoche = heute => 6 - (alsDatum(heute).getUTCDay() + 6) % 7;

function tagName(tag, heute) {
  const tage = abstand(tag, heute);
  return tage === 0 ? "Heute" : tage === 1 ? "Morgen" : tage <= resteWoche(heute) ? tagLang.format(alsDatum(tag)) : kurzesDatum(tag);
}

// Striche des Ziffernblatts einmalig berechnen
function zeichneZifferblatt() {
  let minuten = "", stunden = "";
  for (let m = 0; m < 60; m++) {
    const w = m * Math.PI / 30, s = Math.sin(w), c = -Math.cos(w);
    const innen = m % 5 ? 85 : 76;
    const strich = `M${(s * innen).toFixed(1)} ${(c * innen).toFixed(1)}L${(s * 90).toFixed(1)} ${(c * 90).toFixed(1)}`;
    if (m % 5) minuten += strich; else stunden += strich;
  }
  $("minutenstriche").setAttribute("d", minuten);
  $("stundenstriche").setAttribute("d", stunden);
}

function zeigeZeiger(zeit) {
  const h = Number(zeit.slice(0, 2)), m = Number(zeit.slice(3));
  $("stundenzeiger").setAttribute("transform", `rotate(${(h % 12 + m / 60) * 30})`);
  $("minutenzeiger").setAttribute("transform", `rotate(${m * 6})`);
}

function zeigeMuell() {
  const box = $("muell");
  if (!K.kacheln.muell) { box.style.display = "none"; return; }
  const heute = jetzt().slice(0, 10);
  const naechste = MUELL_TERMINE.filter(t => t.slice(0, 10) >= heute).slice(0, K.muellAnzahl);
  box.innerHTML = naechste.map(t => {
    const tag = t.slice(0, 10), art = t.slice(11);
    const a = K.muellArten[art] || { name: art, farbe: "#a8a8a8" };
    return `<div class="eintrag${abstand(tag, heute) < 2 ? " faellig" : ""}" style="--tonne:${a.farbe}">`
      + `<svg class="tonne"><use href="#tonne-i"/></svg><div>${tagName(tag, heute)}<b>${a.name}</b></div></div>`;
  }).join("") || `<div class="leer">Keine Mülltermine</div>`;
}

function zeigeBus() {
  const box = $("bus");
  if (!K.kacheln.bus) { box.style.display = "none"; return; }
  const nun = Date.now();
  const naechste = BUS_ABFAHRTEN.map(b => ({ zeit: Date.parse(b.slice(0, 20)), linie: b.slice(21).split(" ")[0] }))
    .filter(b => b.zeit > nun).slice(0, K.busAnzahl);
  box.innerHTML = naechste.map(b => {
    const min = Math.ceil((b.zeit - nun) / 60000);
    const wann = min < 60 ? `${min} <small>min</small>` : iso(new Date(b.zeit)).slice(11);
    return `<div class="abfahrt"><b class="linie">${b.linie}</b><span>${wann}</span></div>`;
  }).join("") || `<div class="leer">Keine Abfahrten</div>`;
}

function zeigeTermine() {
  const box = $("termine");
  const stufen = ["minor", "moderate", "severe", "extreme"];
  const warnung = warnungen.find(w => stufen.indexOf(w.severity) >= stufen.indexOf(K.warnungAb)
    && (!w.expires || Date.parse(w.expires) > Date.now()));
  if (warnung) {
    const bis = warnung.expires ? iso(new Date(warnung.expires)) : "";
    const wann = bis ? `bis ${bis.slice(0, 10) === jetzt().slice(0, 10) ? "" : tagKurz.format(new Date(warnung.expires)) + ", "}${bis.slice(11)}` : "";
    box.style.display = "";
    box.innerHTML = `<div id="warnung"><b>${warnung.event_de}</b>${wann}</div>`;
    return;
  }
  const j = jetzt(), heute = j.slice(0, 10);
  const naechste = K.kacheln.termine
    ? KALENDER_TERMINE.filter(t => t.split(" ")[0] >= heute && (t[10] !== "T" || t.slice(0, 16) > j)).slice(0, K.termineAnzahl) : [];
  box.style.display = naechste.length ? "" : "none";
  box.innerHTML = naechste.map(t => {
    const zeitpunkt = t.split(" ")[0], titel = t.slice(zeitpunkt.length + 1);
    const uhrzeit = zeitpunkt.length > 10 ? ` ${zeitpunkt.slice(11)}` : "";
    return `<div class="termin">${tagName(zeitpunkt.slice(0, 10), heute)}${uhrzeit}<b>${titel}</b></div>`;
  }).join("");
}

let wetter = null;
let warnungen = [];
let online = true;
try { wetter = JSON.parse(localStorage.getItem("wetter")); } catch (e) { /* Speicher nicht verfügbar */ }

function offlineHinweis() {
  if (online) return "";
  const stand = wetter && iso(new Date(wetter.stand));
  const zeit = !stand ? "" : stand.slice(0, 10) === jetzt().slice(0, 10) ? stand.slice(11)
    : `${stand.slice(8, 10)}.${stand.slice(5, 7)}.`;
  return `<div class="offline">offline ${zeit}</div>`;
}

function zeigeWetter() {
  if (!wetter) {
    $("wetter").innerHTML = `<div class="jetzt"><div><div class="temp">–</div>${offlineHinweis()}</div></div>`;
    return;
  }
  const { current: c, hourly: h, daily: d } = wetter;
  const jetztTemp = grad(c.temperature_2m);
  let html = `<div class="jetzt">${wetterSymbol(c.weather_code, c.is_day)}<div><div class="temp${jetztTemp.length > 3 ? " lang" : ""}">${jetztTemp}</div>`
    + `<div class="text">${wmo(c.weather_code)[1]}</div>${offlineHinweis()}</div></div>`;

  const j = jetzt(), heute = j.slice(0, 10);
  const n = K.stundenAnzahl;
  // Die Stunden verteilen sich auf den Rest des Tages, spätabends läuft es in die Nacht weiter
  const schritt = Math.max(1, Math.floor((24 - Number(j.slice(11, 13))) / n));
  const start = h.time.findIndex(t => t > j);
  if (K.kacheln.stunden && start >= 0) {
    html += `<div class="gruppe">`;
    for (let i = 0; i < n && start + i * schritt < h.time.length; i++) {
      const s = start + i * schritt, regen = h.precipitation_probability[s];
      html += `<div class="reihe"><span>${h.time[s].slice(11, 16)}</span>${wetterSymbol(h.weather_code[s], h.is_day[s])}`
        + `<span class="temp">${grad(h.temperature_2m[s])}</span><span class="neben regen">${regen >= 20 ? regen + "%" : ""}</span></div>`;
    }
    html += `</div>`;
  }
  if (K.kacheln.tage) {
    html += `<div class="gruppe tage">`;
    d.time.map((t, i) => [t, i]).filter(([t]) => t > heute).slice(0, K.tageAnzahl).forEach(([t, i]) => {
      html += `<div class="reihe"><span>${tagKurz.format(alsDatum(t))}</span>${wetterSymbol(d.weather_code[i])}`
        + `<span class="temp">${grad(d.temperature_2m_max[i])}</span><span class="neben">${grad(d.temperature_2m_min[i])}</span></div>`;
    });
    html += `</div>`;
  }
  $("wetter").innerHTML = html;

  const heuteNr = d.time.indexOf(heute);
  const uhrzeit = t => t.slice(11, 16).replace(/^0/, "");
  $("sonne").innerHTML = heuteNr < 0 ? "" : `<span>${symbol("aufgang")}${uhrzeit(d.sunrise[heuteNr])}</span>`
    + `<span>${symbol("untergang")}${uhrzeit(d.sunset[heuteNr])}</span>`;
}

async function ladeJson(url) {
  // Ohne Netzverbindung gar nicht erst abrufen, Firefox meldet sonst einen CORS-Fehler in der Konsole
  if (!navigator.onLine) throw new Error("offline");
  const abbruch = new AbortController();
  const frist = setTimeout(() => abbruch.abort(), 20000);
  try {
    const antwort = await fetch(url, { signal: abbruch.signal });
    if (!antwort.ok) throw new Error(antwort.status);
    return await antwort.json();
  } finally {
    clearTimeout(frist);
  }
}

async function holeDaten() {
  const ort = `lat=${K.breite}&lon=${K.laenge}`;
  const wetterUrl = `https://api.open-meteo.com/v1/forecast?latitude=${K.breite}&longitude=${K.laenge}`
    + `&timezone=${encodeURIComponent(tz)}&forecast_days=7`
    + "&current=temperature_2m,weather_code,is_day"
    + "&hourly=temperature_2m,weather_code,is_day,precipitation_probability"
    + "&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset";
  try {
    const daten = await ladeJson(wetterUrl);
    daten.stand = Date.now();
    wetter = daten;
    online = true;
    try { localStorage.setItem("wetter", JSON.stringify(daten)); } catch (e) { /* ohne Speicher weiter */ }
  } catch (e) {
    online = false;
  }
  if (online && K.kacheln.warnung) {
    try {
      warnungen = (await ladeJson(`https://api.brightsky.dev/alerts?${ort}&tz=${encodeURIComponent(tz)}`)).alerts;
    } catch (e) { /* letzte Warnung bleibt, bis sie abläuft */ }
  }
  sicher(zeigeWetter);
  sicher(zeigeTermine);
  // Nach einem Fehlschlag bald erneut versuchen, z. B. wenn das WLAN nach dem Start noch fehlt
  setTimeout(holeDaten, (online ? K.wetterAbrufMinuten : 2) * 60000);
}

// Ein Fehler in einer Anzeige darf den Minutentakt der Uhr nicht anhalten
function sicher(zeige) {
  try { zeige(); } catch (e) { console.error(e); }
}

let letzteStunde = "";
function tick() {
  const j = jetzt(), zeit = j.slice(11);
  if (zeit === K.neuLadenUm && performance.now() > 60000) location.reload();
  $("uhr").innerHTML = zeit.replace(":", "<span>:</span>");
  zeigeZeiger(zeit);
  sicher(zeigeBus);
  const nacht = K.nachtVon > K.nachtBis ? zeit >= K.nachtVon || zeit < K.nachtBis : zeit >= K.nachtVon && zeit < K.nachtBis;
  document.documentElement.classList.toggle("nacht", nacht);
  if (j.slice(0, 13) !== letzteStunde) {
    letzteStunde = j.slice(0, 13);
    const tag = j.slice(0, 10);
    $("datum").textContent = `${tagKurz.format(alsDatum(tag))}, ${Number(tag.slice(8))}. ${monatKurz.format(alsDatum(tag))}`;
    sicher(zeigeMuell);
    sicher(zeigeTermine);
    sicher(zeigeWetter);
  }
  setTimeout(tick, 60000 - Date.now() % 60000);
}

zeichneZifferblatt();
tick();
holeDaten();
</script>
