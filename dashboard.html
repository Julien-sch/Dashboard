<style>
  /* 1rem = 1 % der Höhe bei 16:9, damit alles mit dem Bildschirm skaliert */
  html { font-size: min(1vh, .5625vw); }
  /* Keine Schatten, Unschärfe oder Animationen, das schont das schwache Gerät.
     Der Hintergrund ist der Himmel über dem Standort: himmel() setzt --himmel jede Minute

  :root {

<script>
const $ = id => document.getElementById(id);
const K = KONFIG;
const tz = K.zeitzone;
const isoFormat = new Intl.DateTimeFormat("sv-SE", { timeZone: tz, dateStyle: "short", timeStyle: "short" });
const tagKurz = new Intl.DateTimeFormat("de-DE", { timeZone: tz, weekday: "short" });
const tagLang = new Intl.DateTimeFormat("de-DE", { timeZone: tz, weekday: "long" });
const monatKurz = new Intl.DateTimeFormat("de-DE", { timeZone: tz, month: "short" });

// Zeit in Berlin als "JJJJ-MM-TTTHH:MM", im selben Format wie Open-Meteo
const iso = d => isoFormat.format(d).replace(" ", "T");
const jetzt = () => iso(new Date());
const alsDatum = tag => new Date(tag + "T12:00:00Z");

// WMO-Wettercodes: [bis Code, Text, Symbol]
const WMO = [
  [0, "Klar", "sonne-i"], [1, "Heiter", "sonne-i"], [2, "Wolkig", "teils"], [3, "Bedeckt", "wolke"],
  [48, "Nebel", "nebel"], [55, "Niesel", "regen"], [57, "Eisregen", "regen"], [65, "Regen", "regen"],
  [67, "Eisregen", "regen"], [77, "Schnee", "schnee"], [82, "Schauer", "regen"], [86, "Schnee", "schnee"],
  [99, "Gewitter", "gewitter"],
];
const text = s => s.replace(/[&<>"]/g, z => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[z]);
const wmo = code => WMO.find(w => code <= w[0]) || WMO[3];
const grad = t => String(Math.round(t)).replace("-", "−") + "°";
const symbol = name => `<svg><use href="#${name}"/></svg>`;
const wetterSymbol = (code, tag = 1) => symbol(wmo(code)[2] === "sonne-i" && !tag ? "mond" : wmo(code)[2]);
const abstand = (tag, heute) => Math.round((alsDatum(tag) - alsDatum(heute)) / 864e5);
const kurzesDatum = tag => `${tagKurz.format(alsDatum(tag))}, ${tag.slice(8)}.${tag.slice(5, 7)}.`;

// Tage bis zum Sonntag dieser Woche
const resteWoche = heute => 6 - (alsDatum(heute).getUTCDay() + 6) % 7;

function tagName(tag, heute) {
  const tage = abstand(tag, heute);
  return tage === 0 ? "Heute" : tage === 1 ? "Morgen" : tage <= resteWoche(heute) ? tagLang.format(alsDatum(tag)) : kurzesDatum(tag);
}

// Striche des Ziffernblatts einmalig berechnen
function zeichneZifferblatt() {
  let minuten = "", stunden = "";
  for (let m = 0; m < 60; m++) {
    const w = m * Math.PI / 30, s = Math.sin(w), c = -Math.cos(w);
    const innen = m % 5 ? 85 : 76;
    const strich = `M${(s * innen).toFixed(1)} ${(c * innen).toFixed(1)}L${(s * 90).toFixed(1)} ${(c * 90).toFixed(1)}`;
    if (m % 5) minuten += strich; else stunden += strich;
  }
  $("minutenstriche").setAttribute("d", minuten);
  $("stundenstriche").setAttribute("d", stunden);
}

function zeigeZeiger(zeit) {
  const h = Number(zeit.slice(0, 2)), m = Number(zeit.slice(3));
  $("stundenzeiger").setAttribute("transform", `rotate(${(h % 12 + m / 60) * 30})`);
  $("minutenzeiger").setAttribute("transform", `rotate(${m * 6})`);
}

function zeigeMuell() {
  const box = $("muell");
  if (!K.kacheln.muell) { box.style.display = "none"; return; }
  const heute = jetzt().slice(0, 10);
  const naechste = MUELL_TERMINE.filter(t => t.slice(0, 10) >= heute).slice(0, K.muellAnzahl);
  box.innerHTML = naechste.map(t => {
    const tag = t.slice(0, 10), art = t.slice(11);
    const a = K.muellArten[art] || { name: art, farbe: "#a8a8a8" };
    return `<div class="eintrag${abstand(tag, heute) < 2 ? " faellig" : ""}" style="--tonne:${a.farbe}">`
      + `<svg class="tonne"><use href="#tonne-i"/></svg><div>${tagName(tag, heute)}<b>${a.name}</b></div></div>`;
  }).join("") || `<div class="leer">Keine Mülltermine</div>`;
}

function zeigeBus() {
  const box = $("bus");
  if (!K.kacheln.bus) { box.style.display = "none"; return; }
  const nun = Date.now();
  const naechste = BUS_ABFAHRTEN.map(b => ({ zeit: Date.parse(b.slice(0, 20)), linie: b.slice(21).split(" ")[0] }))
    .filter(b => b.zeit > nun).slice(0, K.busAnzahl);
  box.innerHTML = naechste.map(b => {
    const min = Math.ceil((b.zeit - nun) / 60000);
    const wann = min < 60 ? `${min} <small>min</small>` : iso(new Date(b.zeit)).slice(11);
    return `<div class="abfahrt"><b class="linie">${b.linie}</b><span>${wann}</span></div>`;
  }).join("") || `<div class="leer">Keine Abfahrten</div>`;
}

function zeigeTermine() {
  const box = $("termine");
  const stufen = ["minor", "moderate", "severe", "extreme"];
  const warnung = warnungen.find(w => stufen.indexOf(w.severity) >= stufen.indexOf(K.warnungAb)
    && (!w.expires || Date.parse(w.expires) > Date.now()));
  if (warnung) {
    const bis = warnung.expires ? iso(new Date(warnung.expires)) : "";
    const wann = bis ? `bis ${bis.slice(0, 10) === jetzt().slice(0, 10) ? "" : tagKurz.format(new Date(warnung.expires)) + ", "}${bis.slice(11)}` : "";
    box.style.display = "";
    box.innerHTML = `<div id="warnung"><b>${warnung.event_de}</b>${wann}</div>`;
    return;
  }
  const heute = jetzt().slice(0, 10);
  const naechste = K.kacheln.termine ? kommendeTermine().slice(0, K.termineAnzahl) : [];
  box.style.display = naechste.length ? "" : "none";
  box.innerHTML = naechste.map(t =>
    `<div class="termin">${tagName(t.tag, heute)}${t.uhrzeit ? " " + t.uhrzeit : ""}<b>${text(t.titel)}</b></div>`
  ).join("");
}

// Warnt, wenn eine Quelle seit mehr als einem Tag nicht abgerufen werden konnte (z. B. ohne WLAN)
function zeigeVeraltet() {
  const heute = jetzt().slice(0, 10);
  const namen = { MUELL: "Müll", BUS: "Bus", KALENDER: "Kalender", TANKEN: "Spritpreise" };
  const alt = Object.keys(DATEN_ERFOLG).filter(q => abstand(DATEN_ERFOLG[q], heute) < -1)
    .map(q => `${namen[q] || q} ${DATEN_ERFOLG[q].slice(8)}.${DATEN_ERFOLG[q].slice(5, 7)}.`);
  $("veraltet").textContent = alt.length ? `Daten veraltet: ${alt.join(", ")}` : "";
}

// Termine ab jetzt; vergangene mit Uhrzeit fallen heraus, ganztägige von heute bleiben
function kommendeTermine() {
  const j = jetzt(), heute = j.slice(0, 10);
  return KALENDER_TERMINE.filter(t => t.split(" ")[0] >= heute && (t[10] !== "T" || t.slice(0, 16) > j)).map(t => {
    const zeitpunkt = t.split(" ")[0];
    return { tag: zeitpunkt.slice(0, 10), uhrzeit: zeitpunkt.slice(11), titel: t.slice(zeitpunkt.length + 1) };
  });
}

// Vollbild mit allen Terminen der nächsten Zeit, öffnet bei Tipp auf die Termin-Kachel
let kalenderZu = null;
function oeffneKalender() {
  const heute = jetzt().slice(0, 10);
  const termine = kommendeTermine().filter(t => abstand(t.tag, heute) < K.kalenderTage);
  const tage = [];
  termine.forEach(t => {
    if (!tage.length || tage[tage.length - 1].tag !== t.tag) tage.push({ tag: t.tag, termine: [] });
    tage[tage.length - 1].termine.push(t);
  });
  $("kalender").classList.add("offen");
  const liste = $("kalenderliste");
  liste.innerHTML = tage.map(({ tag, termine }) => {
    const name = tagName(tag, heute);
    const kopf = name.includes(".") ? name : `${name}, ${tag.slice(8)}.${tag.slice(5, 7)}.`;
    return `<div class="kalendertag${tag === heute ? " heute" : ""}"><h2>${kopf}</h2>`
      + termine.map(t => `<div class="ktermin"><span>${t.uhrzeit || "ganztags"}</span><b>${text(t.titel)}</b></div>`).join("")
      + `</div>`;
  }).join("") || `<div class="leer">Keine Termine in den nächsten ${K.kalenderTage} Tagen</div>`;
  // Was nicht mehr auf den Bildschirm passt, tageweise von hinten weglassen
  let weg = 0;
  while (liste.children.length > 1 && liste.scrollWidth > liste.clientWidth + 1) {
    weg += liste.lastElementChild.querySelectorAll(".ktermin").length;
    liste.lastElementChild.remove();
  }
  $("kalenderinfo").textContent = weg ? `+${weg} weitere` : `nächste ${K.kalenderTage} Tage`;
  clearTimeout(kalenderZu);
  kalenderZu = setTimeout(schliesseKalender, 60000);
}

function schliesseKalender() {
  clearTimeout(kalenderZu);
  $("kalender").classList.remove("offen");
}

let wetter = null;
let warnungen = [];
let online = true;
try { wetter = JSON.parse(localStorage.getItem("wetter")); } catch (e) { /* Speicher nicht verfügbar */ }

function offlineHinweis() {
  if (online) return "";
  const stand = wetter && iso(new Date(wetter.stand));
  const zeit = !stand ? "" : stand.slice(0, 10) === jetzt().slice(0, 10) ? stand.slice(11)
    : `${stand.slice(8, 10)}.${stand.slice(5, 7)}.`;
  return `<div class="offline">offline ${zeit}</div>`;
}

function zeigeWetter() {
  if (!wetter) {
    $("wetter").innerHTML = `<div class="jetzt"><div><div class="temp">–</div>${offlineHinweis()}</div></div>`;
    return;
  }
  const { current: c, hourly: h, daily: d } = wetter;
  const jetztTemp = grad(c.temperature_2m);
  let html = `<div class="jetzt">${wetterSymbol(c.weather_code, c.is_day)}<div><div class="temp${jetztTemp.length > 3 ? " lang" : ""}">${jetztTemp}</div>`
    + `<div class="text">${wmo(c.weather_code)[1]}</div>${offlineHinweis()}</div></div>`;

  const j = jetzt(), heute = j.slice(0, 10);
  const hinweise = [regenHinweis(wetter.minutely_15, j, c.temperature_2m), frostHinweis(h, d, j)].filter(Boolean);
  if (hinweise.length) html += `<div class="hinweise">${hinweise.join("")}</div>`;
  const n = K.stundenAnzahl;
  // Die Stunden verteilen sich auf den Rest des Tages, spätabends läuft es in die Nacht weiter
  const schritt = Math.max(1, Math.floor((24 - Number(j.slice(11, 13))) / n));
  const start = h.time.findIndex(t => t > j);
  if (K.kacheln.stunden && start >= 0) {
    html += `<div class="gruppe">`;
    for (let i = 0; i < n && start + i * schritt < h.time.length; i++) {
      const s = start + i * schritt, regen = h.precipitation_probability[s];
      html += `<div class="reihe"><span>${h.time[s].slice(11, 16)}</span>${wetterSymbol(h.weather_code[s], h.is_day[s])}`
        + `<span class="temp">${grad(h.temperature_2m[s])}</span><span class="neben regen">${regen >= 20 ? regen + "%" : ""}</span></div>`;
    }
    html += `</div>`;
  }
  if (K.kacheln.tage) {
    html += `<div class="gruppe tage">`;
    d.time.map((t, i) => [t, i]).filter(([t]) => t > heute).slice(0, K.tageAnzahl).forEach(([t, i]) => {
      html += `<div class="reihe"><span>${tagKurz.format(alsDatum(t))}</span>${wetterSymbol(d.weather_code[i])}`
        + `<span class="temp">${grad(d.temperature_2m_max[i])}</span><span class="neben">${grad(d.temperature_2m_min[i])}</span></div>`;
    });
    html += `</div>`;
  }
  $("wetter").innerHTML = html;

  const heuteNr = d.time.indexOf(heute);
  const uhrzeit = t => t.slice(11, 16).replace(/^0/, "");
  $("sonne").innerHTML = heuteNr < 0 ? "" : `<span>${symbol("aufgang")}${uhrzeit(d.sunrise[heuteNr])}</span>`
    + `<span>${symbol("untergang")}${uhrzeit(d.sunset[heuteNr])}</span>`;
}

// Himmelsfarben [oben, Horizont]; dazwischen wird je nach Uhrzeit gemischt
const HIMMEL = {
  nacht:  ["#060912", "#0e1527"],
  morgen: ["#1a2147", "#7b4a63"],
  tag:    ["#0f355f", "#3b6f9a"],
  grau:   ["#232b36", "#46515e"],
  abend:  ["#1f1c40", "#9a4f36"],
};
const mische = (a, b, t) => "#" + [1, 3, 5].map(i =>
  Math.round(parseInt(a.substr(i, 2), 16) * (1 - t) + parseInt(b.substr(i, 2), 16) * t).toString(16).padStart(2, "0")).join("");
const mischePaar = (a, b, t) => [mische(a[0], b[0], t), mische(a[1], b[1], t)];
const minuten = t => Number(t.slice(11, 13)) * 60 + Number(t.slice(14, 16));

let letzterHimmel = "";
function himmel() {
  const j = jetzt(), m = minuten(j);
  let auf = 450, unter = 1020, wolken = 0;   // ohne Wetterdaten: 7:30 und 17:00, klar
  if (wetter) {
    const i = wetter.daily.time.indexOf(j.slice(0, 10));
    if (i >= 0) { auf = minuten(wetter.daily.sunrise[i]); unter = minuten(wetter.daily.sunset[i]); }
    const c = wetter.current.weather_code;
    wolken = c <= 1 ? 0 : c === 2 ? .4 : c <= 48 ? .85 : 1;
  }
  const tag = mischePaar(HIMMEL.tag, HIMMEL.grau, wolken);
  const punkte = [[auf - 90, HIMMEL.nacht], [auf - 15, HIMMEL.morgen], [auf + 60, tag],
                  [unter - 60, tag], [unter + 10, HIMMEL.abend], [unter + 80, HIMMEL.nacht]];
  let farben = HIMMEL.nacht;
  for (let k = 0; k < punkte.length - 1; k++) {
    const [a, fa] = punkte[k], [b, fb] = punkte[k + 1];
    if (m >= a && m < b) { farben = mischePaar(fa, fb, (m - a) / (b - a)); break; }
  }
  // Die Sonne wandert als schwacher Schein von links (Osten) nach rechts (Westen)
  let schein = "";
  if (m > auf - 30 && m < unter + 30) {
    const p = Math.min(1, Math.max(0, (m - auf) / (unter - auf))), bogen = Math.sin(Math.PI * p);
    const staerke = ((.14 + .14 * (1 - bogen)) * (1 - .75 * wolken)).toFixed(3);
    schein = `radial-gradient(circle 75rem at ${(8 + p * 84).toFixed(1)}% ${(78 - bogen * 62).toFixed(1)}%, `
      + `rgba(255, 196, 128, ${staerke}), rgba(255, 196, 128, 0)), `;
  }
  const wert = `${schein}linear-gradient(${farben[0]}, ${farben[1]})`;
  if (wert === letzterHimmel) return;
  letzterHimmel = wert;
  document.documentElement.style.setProperty("--himmel", wert);
}

// "Regen ab 18:15" in den nächsten 3 Stunden bzw. "Regen bis 18:45", wenn es gerade regnet
function regenHinweis(m, j, temperatur) {
  if (!m || !m.time) return "";
  const naechster = m.time.findIndex(t => t > j);
  if (naechster < 0) return "";   // Vorhersage liegt komplett in der Vergangenheit
  const jetztNr = naechster - 1;
  const nass = k => m.precipitation[k] >= 0.1;
  const art = temperatur <= 1 ? "Schnee" : "Regen";
  const zeile = text => `<div class="hinweis">${symbol(art === "Schnee" ? "schnee" : "regen")}${text}</div>`;
  if (jetztNr >= 0 && nass(jetztNr)) {
    const ende = m.time.findIndex((t, k) => k > jetztNr && !nass(k));
    return ende < 0 ? zeile(`${art} hält an`) : zeile(`${art} bis ${m.time[ende].slice(11, 16)}`);
  }
  const beginn = m.time.findIndex((t, k) => k > jetztNr && k <= jetztNr + 12 && nass(k));
  return beginn < 0 ? "" : zeile(`${art} ab ${m.time[beginn].slice(11, 16)}`);
}

// Ab 15 Uhr für den nächsten Morgen, bis 9 Uhr für den laufenden Morgen
function frostHinweis(h, d, j) {
  const stunde = Number(j.slice(11, 13)), heute = j.slice(0, 10);
  const tag = stunde >= 15 ? d.time.find(t => t > heute) : stunde < 9 ? heute : null;
  if (!tag) return "";
  const werte = h.time.map((t, i) => [t, h.temperature_2m[i]])
    .filter(([t]) => t.slice(0, 10) === tag && t.slice(11, 13) >= "05" && t.slice(11, 13) <= "08").map(([, w]) => w);
  if (!werte.length) return "";
  const kaelteste = Math.min(...werte);
  if (kaelteste > K.frostAb) return "";
  return `<div class="hinweis">${symbol("frost")}${tag === heute ? "Frost" : "Morgen früh"} ${grad(kaelteste)}: Scheibe kratzen</div>`;
}

// Günstigste geöffnete Tankstelle; Preise älter als 3 Stunden werden nicht mehr gezeigt
function zeigeTanken() {
  const box = $("tanken");
  const sorte = K.sprit;
  const frisch = TANKEN.length && Date.now() - Date.parse(TANKEN[0].zeit) < 3 * 3600e3;
  const offen = K.kacheln.tanken && frisch ? TANKEN.filter(t => t.offen && t[sorte]) : [];
  if (!offen.length) { box.style.display = "none"; return; }
  const t = offen.reduce((a, b) => b[sorte] < a[sorte] ? b : a);
  const p = t[sorte].toFixed(3).replace(".", ",");
  const namen = { e5: "Super", e10: "E10", diesel: "Diesel" };
  box.style.display = "";
  box.innerHTML = `${symbol("zapfsaeule")}<div class="tankstelle">${text(t.name)}</div>`
    + `<span class="sorte">${namen[sorte] || sorte}</span><b class="preis">${p.slice(0, -1)}<sup>${p.slice(-1)}</sup></b>`;
}

async function ladeJson(url) {
  // Ohne Netzverbindung gar nicht erst abrufen, Firefox meldet sonst einen CORS-Fehler in der Konsole
  if (!navigator.onLine) throw new Error("offline");
  const abbruch = new AbortController();
  const frist = setTimeout(() => abbruch.abort(), 20000);
  try {
    const antwort = await fetch(url, { signal: abbruch.signal });
    if (!antwort.ok) throw new Error(antwort.status);
    return await antwort.json();
  } finally {
    clearTimeout(frist);
  }
}

async function holeDaten() {
  const ort = `lat=${K.breite}&lon=${K.laenge}`;
  const wetterUrl = `https://api.open-meteo.com/v1/forecast?latitude=${K.breite}&longitude=${K.laenge}`
    + `&timezone=${encodeURIComponent(tz)}&forecast_days=7`
    + "&current=temperature_2m,weather_code,is_day"
    + "&minutely_15=precipitation&forecast_minutely_15=16"
    + "&hourly=temperature_2m,weather_code,is_day,precipitation_probability"
    + "&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset";
  try {
    const daten = await ladeJson(wetterUrl);
    daten.stand = Date.now();
    wetter = daten;
    online = true;
    try { localStorage.setItem("wetter", JSON.stringify(daten)); } catch (e) { /* ohne Speicher weiter */ }
  } catch (e) {
    online = false;
  }
  if (online && K.kacheln.warnung) {
    try {
      warnungen = (await ladeJson(`https://api.brightsky.dev/alerts?${ort}&tz=${encodeURIComponent(tz)}`)).alerts;
    } catch (e) { /* letzte Warnung bleibt, bis sie abläuft */ }
  }
  sicher(zeigeWetter);
  sicher(zeigeTermine);
  sicher(himmel);
  // Nach einem Fehlschlag bald erneut versuchen, z. B. wenn das WLAN nach dem Start noch fehlt
  setTimeout(holeDaten, (online ? K.wetterAbrufMinuten : 2) * 60000);
}

// Ein Fehler in einer Anzeige darf den Minutentakt der Uhr nicht anhalten
function sicher(zeige) {
  try { zeige(); } catch (e) { console.error(e); }
}

// dashboard-update.py legt neben der Seite dashboard-stand.js ab, sobald es neue Daten geschrieben hat.
// Fetch auf file:// ist gesperrt, ein Script-Tag darf die Datei aber laden; sie ruft datenStand() auf.
function pruefeDaten() {
  const s = document.createElement("script");
  s.src = "dashboard-stand.js?" + Date.now();
  s.onload = s.onerror = () => s.remove();
  document.head.appendChild(s);
}

function datenStand(stand) {
  if (stand === DATEN_STAND) return;
  // Höchstens einmal je Stand neu laden, falls die Seite einmal nicht zur Datei passt
  let schon = null;
  try { schon = localStorage.getItem("datenStand"); localStorage.setItem("datenStand", stand); } catch (e) { return; }
  if (schon !== stand) location.reload();
}

let letzteStunde = "";
function tick() {
  const j = jetzt(), zeit = j.slice(11);
  if (zeit === K.neuLadenUm && performance.now() > 60000) location.reload();
  if (Number(zeit.slice(3)) % 5 === 0) pruefeDaten();
  $("uhr").innerHTML = zeit.replace(":", "<span>:</span>");
  zeigeZeiger(zeit);
  sicher(zeigeBus);
  sicher(himmel);
  const nacht = K.nachtVon > K.nachtBis ? zeit >= K.nachtVon || zeit < K.nachtBis : zeit >= K.nachtVon && zeit < K.nachtBis;
  document.documentElement.classList.toggle("nacht", nacht);
  if (j.slice(0, 13) !== letzteStunde) {
    letzteStunde = j.slice(0, 13);
    const tag = j.slice(0, 10);
    $("datum").textContent = `${tagKurz.format(alsDatum(tag))}, ${Number(tag.slice(8))}. ${monatKurz.format(alsDatum(tag))}`;
    sicher(zeigeMuell);
    sicher(zeigeTermine);
    sicher(zeigeWetter);
    sicher(zeigeVeraltet);
    sicher(zeigeTanken);
  }
  setTimeout(tick, 60000 - Date.now() % 60000);
}

$("termine").addEventListener("click", () => sicher(oeffneKalender));
$("kalender").addEventListener("click", schliesseKalender);
zeichneZifferblatt();
tick();
holeDaten();
